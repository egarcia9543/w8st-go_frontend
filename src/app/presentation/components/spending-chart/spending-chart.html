<div class="space-y-3">
  <div class="flex flex-wrap items-center gap-4 text-sm">
    <span class="flex items-center gap-2 text-muted-foreground">
      <span class="h-2.5 w-2.5 rounded-sm" style="background: var(--series-pocket)"></span>
      De mi bolsillo
    </span>
    <span class="flex items-center gap-2 text-muted-foreground">
      <span class="h-2.5 w-2.5 rounded-sm" style="background: var(--series-credit)"></span>
      Con crédito
    </span>
    <span class="flex items-center gap-2 text-muted-foreground">
      <span class="h-0.5 w-4 rounded-full" style="background: var(--series-income)"></span>
      Ingresos
    </span>
  </div>

  <div class="relative">
    <svg
      [attr.viewBox]="'0 0 ' + width + ' ' + height"
      class="w-full h-auto"
      role="img"
      aria-label="Gasto de bolsillo y con crédito por mes, con los ingresos superpuestos"
    >
      @for (tick of ticks(); track tick.value) {
        <line
          [attr.x1]="plotLeft"
          [attr.x2]="plotRight"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
          class="stroke-border"
          stroke-width="1"
        />
        <text
          [attr.x]="plotLeft - 10"
          [attr.y]="tick.y + 3"
          text-anchor="end"
          class="fill-muted-foreground text-[10px] tabular-nums"
        >
          {{ tick.label }}
        </text>
      }

      @for (group of groups(); track group.month; let i = $index) {
        <g
          [class.opacity-45]="hovered() !== null && hovered() !== i"
          class="transition-opacity duration-150"
        >
          @if (group.pocket.height > 0) {
            <path [attr.d]="group.pocket.path" style="fill: var(--series-pocket)" />
          }
          @if (group.credit.height > 0) {
            <path [attr.d]="group.credit.path" style="fill: var(--series-credit)" />
          }
        </g>

        <text
          [attr.x]="group.center"
          [attr.y]="baseline + 20"
          text-anchor="middle"
          class="fill-muted-foreground text-[11px]"
        >
          {{ group.label }}
        </text>
      }

      <polyline
        [attr.points]="incomePath()"
        fill="none"
        style="stroke: var(--series-income)"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />

      @for (group of groups(); track group.month) {
        <circle
          [attr.cx]="group.center"
          [attr.cy]="group.incomeY"
          r="4"
          style="fill: var(--series-income); stroke: var(--card)"
          stroke-width="2"
        />
      }

      @if (incomeEnd(); as end) {
        <text
          [attr.x]="end.x + 12"
          [attr.y]="end.y + 4"
          class="fill-foreground text-[11px] font-semibold tabular-nums"
        >
          {{ end.label }}
        </text>
      }

      @for (group of groups(); track group.month; let i = $index) {
        <rect
          [attr.x]="group.bandX"
          [attr.width]="group.bandWidth"
          y="0"
          [attr.height]="height"
          fill="transparent"
          class="cursor-pointer"
          (mouseenter)="hovered.set(i)"
          (mouseleave)="hovered.set(null)"
        />
      }
    </svg>

    @if (tooltip(); as t) {
      <div
        class="pointer-events-none absolute top-2 z-10 -translate-x-1/2 rounded-md border border-border bg-popover px-3 py-2 shadow-md"
        [style.left.%]="t.leftPercent"
      >
        <p class="mb-1 text-xs font-semibold text-popover-foreground">{{ t.title }}</p>
        @for (row of t.rows; track row.label) {
          <div class="flex items-center gap-2 text-xs whitespace-nowrap">
            <span class="h-2 w-2 shrink-0 rounded-sm" [style.background]="row.color"></span>
            <span class="text-muted-foreground">{{ row.label }}</span>
            <span class="ml-auto pl-3 font-medium text-popover-foreground tabular-nums">
              {{ row.value }}
            </span>
          </div>
        }
      </div>
    }
  </div>
</div>
